[project]
name = "housing-price-prediction-model-api"
version = "0.1.0"
description = "FastAPI service that predicts housing prices using a Ridge regression model"
readme = "README.md"
authors = [
    { name = "Fangsheng Xu", email = "fangsheng.xu@hawxservices.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "joblib>=1.6.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
