services:
  ml-api:
    build:
      context: ../../ml-model-api
      dockerfile: Dockerfile
    container_name: housing-ml-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - housing-net

  backend-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: housing-backend-python
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - ML_API_URL=http://ml-api:8000
      - DATABASE_URL=sqlite+aiosqlite:////app/data/predictions.db
    restart: unless-stopped
    depends_on:
      ml-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - backend-data:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - housing-net

volumes:
  backend-data:
    driver: local

networks:
  housing-net:
    driver: bridge
